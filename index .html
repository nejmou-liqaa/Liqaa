<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لقاء</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#2a1052;--bg2:#0f1e4a;--card:#fff3e6;--ink:#2a1052;--acc:#ff6f59;--soft:#c9bdf0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#1b1245;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:#fff;font-family:Tajawal,system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{margin:0 0 4px;font-size:30px}h2{margin:6px 0;font-size:26px}p{line-height:1.8;margin:6px 0}
.card{background:var(--card);color:var(--ink);border-radius:32px;padding:28px 22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.av{width:112px;height:112px;margin:-62px auto 8px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:60px;border:6px solid var(--card)}
.top{height:50px}.ct{opacity:.65;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.ch{padding:6px 14px;border-radius:20px;background:rgba(42,16,82,.09);font-size:15px;border:0;color:inherit;font-family:inherit;cursor:pointer}
.ch.on{background:var(--acc);color:#fff;font-weight:800}.pc{font-weight:800;color:var(--acc)}
.act{display:flex;gap:12px;margin-top:18px}.act button{flex:1}
button{font:inherit;font-weight:800;font-size:19px;background:var(--acc);color:#fff;border:0;border-radius:18px;padding:14px;cursor:pointer}
button.g{background:rgba(255,255,255,.14)}button.l{background:none;color:var(--soft);font-size:14px;font-weight:500;padding:8px;width:100%;margin-top:6px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #fff;outline-offset:2px}
input,textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:2px solid transparent;background:rgba(255,255,255,.12);color:#fff;margin:6px 0}
input[type=checkbox]{width:22px;height:22px;margin:0 0 0 10px;vertical-align:middle}
input::placeholder,textarea::placeholder{color:var(--soft)}
.em{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.em button{font-size:28px;padding:6px 10px;background:rgba(255,255,255,.12);border-radius:14px}.em button.on{background:var(--acc)}
.fm .ch{background:rgba(255,255,255,.12);color:#fff}.fm .ch.on{background:var(--acc)}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:rgba(255,255,255,.1);margin:10px 0;cursor:pointer}.row .e{font-size:34px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(15,10,45,.85);backdrop-filter:blur(10px)}
nav button{background:transparent;color:var(--soft);font-size:15px;padding:8px 18px}nav button.on{background:var(--acc);color:#fff}
#ml{display:flex;flex-direction:column;gap:8px;min-height:50vh;max-height:60vh;overflow-y:auto;margin:12px 0}
.m{max-width:80%;padding:10px 14px;border-radius:18px;background:rgba(255,255,255,.14)}.m.me{align-self:flex-start;background:var(--acc)}
.snd{display:flex;gap:8px}.snd input{margin:0}.snd button{padding:0 20px}
.c{text-align:center;padding:60px 10px}.big{font-size:70px}
#tt{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;border-radius:30px;font-weight:800;display:none;z-index:9}
</style>
</head>
<body>
<div id="tt"></div><div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,onSnapshot,query,where,limit} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBr-NV6S_NKhFMkiBzbX2DRlWel7sa-AgA",authDomain:"liqaa-app-c7188.firebaseapp.com",projectId:"liqaa-app-c7188",storageBucket:"liqaa-app-c7188.firebasestorage.app",messagingSenderId:"698046020316",appId:"1:698046020316:web:6349e44b9d1822d10b5219"});
const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IN=['كرة القدم','قراءة','سفر','طبخ','موسيقى','ألعاب','تصوير','تقنية','رياضة','أفلام'],EM=['😀','😎','🦊','🌸','🚀','🎨','🐱','⚡'];
let me=null,ready=false,P={},out=new Set(),inn=new Set(),B=new Set(),scr='find',skip=[],F={name:'',emoji:'😀',city:'',bio:'',ints:[],age:false},edit=false,cw=null,msgs=[],un=null,subs=[];
const my=()=>P[me],shared=(a,b)=>(a.ints||[]).filter(i=>(b.ints||[]).includes(i));
const mtch=()=>[...out].filter(id=>inn.has(id)&&P[id]&&!B.has(id));
const key=id=>[me,id].sort().join('-');
function toast(t){const e=$('tt');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
function soft(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName))return;render()}
function login(){return `<div class=c><div class=big>👋</div><h1>لقاء</h1><p>تعرّف على أشخاص يشاركونك اهتماماتك من كل مكان.</p><div class=act><button onclick="signin()">الدخول بحساب Google</button></div></div>`}
function form(){return `<div class=fm><h1>${my()?'ملفك':'أهلًا بك في لقاء 👋'}</h1><p>عرّف الناس بنفسك في دقيقة.</p>
<div class=em>${EM.map(e=>`<button class="${F.emoji===e?'on':''}" onclick="setF('emoji','${e}',1)">${e}</button>`).join('')}</div>
<input placeholder="اسمك" maxlength=24 value="${E(F.name)}" oninput="setF('name',this.value)">
<input placeholder="مدينتك" maxlength=24 value="${E(F.city)}" oninput="setF('city',this.value)">
<textarea rows=3 placeholder="نبذة قصيرة عنك" maxlength=140 oninput="setF('bio',this.value)">${E(F.bio)}</textarea>
<p>اهتماماتك:</p><div class=chips>${IN.map(i=>`<button class="ch ${F.ints.includes(i)?'on':''}" onclick="tg('${i}')">${i}</button>`).join('')}</div>
<p><label><input type=checkbox ${F.age?'checked':''} onchange="setF('age',this.checked)">أؤكد أن عمري 18 سنة أو أكثر</label></p>
<div class=act><button onclick="save()">حفظ والبدء</button></div></div>`}
function find(){const m=my();
const c=Object.keys(P).filter(id=>id!==me&&!skip.includes(id)&&!out.has(id)&&!B.has(id)).sort((x,y)=>shared(m,P[y]).length-shared(m,P[x]).length);
if(!c.length)return `<div class=c><div class=big>🌙</div><h2>لا أحد جديد الآن</h2><p>شارك رابط التطبيق مع أصدقائك ليظهروا هنا.</p></div>`;
const id=c[0],p=P[id],s=shared(m,p);
return `<div class=top></div><div class=card><div class=av>${E(p.emoji)}</div><h2>${E(p.name)}</h2><div class=ct>${E(p.city)}</div><p>${E(p.bio)}</p>
<div class=chips>${(p.ints||[]).map(i=>`<span class="ch ${s.includes(i)?'on':''}">${E(i)}</span>`).join('')}</div>
<div class=pc>${s.length?s.length+' اهتمامات مشتركة':'فرصة لتتعرف على شيء جديد'}</div></div>
<div class=act><button class=g onclick="skipP('${E(id)}')">تخطّي</button><button onclick="hi('${E(id)}')">👋 مرحبًا</button></div><button class=l onclick="rep('${E(id)}')">إبلاغ وحظر هذا الشخص</button>`}
function matchesV(){const l=mtch();return `<h1>تطابقاتك</h1>`+(l.length?l.map(id=>`<div class=row onclick="openChat('${E(id)}')"><span class=e>${E(P[id].emoji)}</span><div><b>${E(P[id].name)}</b><div class=ct>${E(P[id].city)}</div></div></div>`).join(''):`<div class=c><div class=big>💫</div><p>عندما يبادلك أحدهم التحية سيظهر هنا.</p></div>`)}
function drawM(){const e=$('ml');if(!e)return;e.innerHTML=msgs.map(m=>`<div class="m ${m.f===me?'me':''}">${E(m.tx)}</div>`).join('');e.scrollTop=e.scrollHeight}
function chatV(){const p=P[cw]||{};return `<div class=row onclick="go('match')"><span class=e>${E(p.emoji)}</span><b>${E(p.name)}</b></div><div id=ml></div>
<div class=snd><input id=ci placeholder="اكتب رسالة" maxlength=300 onkeydown="if(event.key==='Enter')send()"><button onclick="send()">إرسال</button></div><button class=l onclick="rep('${E(cw)}')">إبلاغ وحظر</button>`}
function mine(){const p=my();return `<div class=top></div><div class=card><div class=av>${E(p.emoji)}</div><h2>${E(p.name)}</h2><div class=ct>${E(p.city)}</div><p>${E(p.bio)}</p><div class=chips>${(p.ints||[]).map(i=>`<span class="ch on">${E(i)}</span>`).join('')}</div></div>
<div class=act><button class=g onclick="editMe()">تعديل ملفي</button><button class=g onclick="logout()">خروج</button></div>`}
function render(){const a=$('app');
if(!ready){a.innerHTML='';return}
if(!me){a.innerHTML=login();return}
if(!my()||edit){a.innerHTML=form();return}
const b=scr==='find'?find():scr==='match'?matchesV():scr==='chat'?chatV():mine();
a.innerHTML=b+`<nav>${[['find','اكتشف'],['match','التطابقات'],['me','ملفي']].map(([k,t])=>`<button class="${scr===k||(k==='match'&&scr==='chat')?'on':''}" onclick="go('${k}')">${t}</button>`).join('')}</nav>`;
if(scr==='chat')drawM()}
function stopChat(){if(un){un();un=null}}
const W={
signin:()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(()=>toast('تعذّر تسجيل الدخول')),
logout:()=>signOut(auth),
setF:(k,v,r)=>{F[k]=v;if(r)render()},
tg:i=>{F.ints=F.ints.includes(i)?F.ints.filter(x=>x!==i):[...F.ints,i];render()},
editMe:()=>{F={age:true,...my(),ints:[...(my().ints||[])]};edit=true;render()},
go:k=>{stopChat();scr=k;render()},
skipP:id=>{skip.push(id);render()},
async save(){if(!F.name.trim())return toast('اكتب اسمك أولًا');if(!F.age)return toast('يجب تأكيد أن عمرك 18 سنة أو أكثر');
const d={name:F.name.trim(),emoji:F.emoji,city:(F.city||'').trim(),bio:(F.bio||'').trim(),ints:F.ints,age18:true,t:Date.now()};
try{await setDoc(doc(db,'profiles',me),d);P[me]=d;edit=false;render()}catch(e){toast('تعذّر الحفظ')}},
async hi(id){out.add(id);try{await setDoc(doc(db,'hellos',me+'-'+id),{f:me,to:id,t:Date.now()})}catch(e){out.delete(id);return toast('تعذّر الإرسال')}
toast(inn.has(id)?'تطابق! 🎉 يمكنكما الدردشة الآن':'أُرسلت التحية 👋');render()},
async rep(id){if(!confirm('سيتم إبلاغنا عن هذا الشخص وحظره. متابعة؟'))return;
try{await setDoc(doc(db,'reports',me+'-'+id+'-'+Date.now()),{by:me,target:id,t:Date.now()});await setDoc(doc(db,'blocks',me+'-'+id),{by:me,target:id,t:Date.now()});B.add(id);toast('تم الإبلاغ والحظر');W.go('find')}catch(e){toast('تعذّر الإبلاغ')}},
openChat:id=>{stopChat();cw=id;scr='chat';msgs=[];
un=onSnapshot(collection(db,'chats',key(id),'m'),s=>{msgs=s.docs.map(d=>d.data()).sort((a,b)=>a.t-b.t);drawM()},()=>{});render()},
async send(){const i=$('ci'),tx=i.value.trim();if(!tx)return;i.value='';const t=Date.now();
try{await setDoc(doc(db,'chats',key(cw),'m',t+Math.random().toString(36).slice(2,6)),{f:me,tx,t})}catch(e){toast('تعذّر الإرسال')}}
};
Object.assign(window,W);
function listen(){
subs.push(onSnapshot(query(collection(db,'profiles'),limit(200)),s=>{P={};s.docs.forEach(x=>P[x.id]=x.data());soft()},()=>{}));
subs.push(onSnapshot(query(collection(db,'hellos'),where('f','==',me)),s=>{out=new Set(s.docs.map(x=>x.data().to));soft()},()=>{}));
subs.push(onSnapshot(query(collection(db,'hellos'),where('to','==',me)),s=>{inn=new Set(s.docs.map(x=>x.data().f));soft()},()=>{}));
subs.push(onSnapshot(query(collection(db,'blocks'),where('by','==',me)),s=>{B=new Set(s.docs.map(x=>x.data().target));soft()},()=>{}))}
onAuthStateChanged(auth,u=>{subs.forEach(f=>f());subs=[];stopChat();P={};out=new Set();inn=new Set();B=new Set();scr='find';edit=false;me=u?u.uid:null;ready=true;if(me)listen();render()});
render();
</script>
</body>
</html>
